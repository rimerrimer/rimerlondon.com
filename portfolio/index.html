<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rimer London - music for you</title>
<style>
  @font-face {
    font-family: 'AlteHaasGrotesk';
    src: url('https://type.cargo.site/files/AlteHaasGrotesk-Regular.woff') format('woff');
    font-weight: 400;
    font-style: normal;
  }
<link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text:  #111;
    --muted: #555;
    --bg:    #fff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'AlteHaasGrotesk', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1;
    transition: background 0.2s, color 0.2s;
  }

  body.dark {
    --text:  #eee;
    --muted: #aaa;
    --bg:    #111;
  }

  body.dark .cell-video { background: #222; }

  body.dark .name img {
    filter: invert(1);
  }

  .dark-toggle {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--muted);
    display: flex;
    align-items: center;
  }
  .dark-toggle:hover { color: var(--text); }
  .dark-toggle svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* ── Header ── */
  header {
    padding: 28px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .name {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

  .name img {
    height: 40px;
    display: block;
  }

  .tagline {
  	font-family: 'Caveat', cursive;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  nav { display: flex; gap: 20px; align-items: center; }

  nav a {
    font-size: 16px;
    color: var(--muted);
    text-decoration: none;
  }
  nav a:hover  { color: var(--text); }
  nav a.active { color: var(--text); }

  .contact-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    font-size: 21px;
    color: var(--muted);
  }
  .contact-btn:hover { color: var(--text); }

  /* ── Contact overlay ── */
  .contact-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .contact-overlay.active {
    pointer-events: auto;
    opacity: 1;
  }
  .contact-backdrop {
    position: absolute;
    inset: 0;
    background: var(--bg);
    opacity: 0.92;
  }
  .contact-panel {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .contact-panel .contact-name {
    font-size: 45px;
    color: var(--text);
    margin-bottom: 24px;
  }
  .contact-panel a {
    font-size: 45px;
    color: var(--text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .contact-panel a:hover { color: var(--muted); }
  .contact-panel a svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
    flex-shrink: 0;
    position: relative;
    top: 2px;
  }


  @media (min-width: 600px) {
    header {
      padding: 36px 60px 0;
    }
    .name img {
      height: 60px;
    }
    .tagline {
      font-size: 12px;
      padding-left: 3px;
    }
    nav { gap: 32px; }
    nav a { font-size: 16px; }
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 40px 24px 40px;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  @media (min-width: 600px) {
    .grid {
      gap: 24px;
      padding: 80px 60px 60px;
    }
  }

  .grid.dimmed {
    opacity: 0.15;
    transform: scale(0.96);
    pointer-events: none;
  }

  .cell {
    display: flex;
    flex-direction: column;
    cursor: pointer;
    min-width: 0;
  }

  /* ── Floating player ── */
  .player-overlay {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .player-overlay.active {
    pointer-events: auto;
    opacity: 1;
  }

  .player-overlay .cell-video {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }

  /* ── Video ── */
  .cell-video {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #f0f0f0;
    overflow: hidden;
    border-radius: 10px;
  }

  .cell-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cell-video .icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
  }
  .cell-video:hover .icon,
  .cell-video.flash .icon { opacity: 1; }

  .cell-video .icon svg {
    width: 40px; height: 40px;
    fill: #fff;
    filter: drop-shadow(0 1px 6px rgba(0,0,0,0.4));
  }

  /* timeline */
  .cell-video .timeline {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .cell-video.playing .timeline,
  .cell-video:hover .timeline {
    opacity: 1;
    pointer-events: auto;
  }

  .timeline-time {
    font-size: 10px;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    min-width: 28px;
    text-align: center;
    flex-shrink: 0;
  }

  .timeline-bar {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    transition: height 0.15s;
  }
  .timeline-bar:hover { height: 5px; }

  .timeline-progress {
    height: 100%;
    background: rgba(255,255,255,0.85);
    border-radius: 2px;
    pointer-events: none;
    width: 0%;
  }

  .timeline-thumb {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    transition: transform 0.15s;
    left: 0%;
  }
  .timeline-bar:hover .timeline-thumb { transform: translate(-50%, -50%) scale(1); }

  /* ── Info ── */
  .cell-info {
    padding: 8px 0 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cell-title {
    font-size: 14px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-meta {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Status / footer ── */
  .status {
    padding: 60px 40px;
    font-size: 14px;
    color: var(--muted);
  }

  footer {
    padding: 48px 40px 40px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ── Visualizer ── */
  #visualizer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 96px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 99;
  }
  #visualizer.active {
    opacity: 1;
  }
</style>
</head>

<script>
function toTitle(filename) {
  return filename
    .replace(/\.(mp4|webm|mov)$/i, '')
    .replace(/[_\-]/g, ' ')
    .replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

function buildGrid(videos) {
  var grid   = document.getElementById('grid');
  var status = document.getElementById('status');

  if (!videos.length) { status.textContent = 'No videos.'; return; }
  status.remove();

  // Shared floating overlay
  var overlay = document.createElement('div');
  overlay.className = 'player-overlay';
  var overlayWrap = document.createElement('div');
  overlayWrap.className = 'cell-video';
  overlayWrap.style.height = '100%';
  overlayWrap.style.aspectRatio = 'unset';
  var overlayVideo = document.createElement('video');
  overlayVideo.playsInline = true;
  overlayVideo.loop = true;
  var overlayIcon = document.createElement('div');
  overlayIcon.className = 'icon';
  overlayIcon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var overlayTl = document.createElement('div'); overlayTl.className = 'timeline';
  var overlayTime = document.createElement('div'); overlayTime.className = 'timeline-time'; overlayTime.textContent = '0:00';
  var overlayBar = document.createElement('div'); overlayBar.className = 'timeline-bar';
  var overlayProg = document.createElement('div'); overlayProg.className = 'timeline-progress';
  var overlayThumb = document.createElement('div'); overlayThumb.className = 'timeline-thumb';
  overlayBar.appendChild(overlayProg);
  overlayBar.appendChild(overlayThumb);
  overlayTl.appendChild(overlayTime);
  overlayTl.appendChild(overlayBar);
  overlayWrap.appendChild(overlayVideo);
  overlayWrap.appendChild(overlayIcon);
  overlayWrap.appendChild(overlayTl);
  overlay.appendChild(overlayWrap);
  document.body.appendChild(overlay);

  overlayWrap.classList.add('playing');

  overlayVideo.addEventListener('timeupdate', function() {
    if (!overlayVideo.duration) return;
    var pct = (overlayVideo.currentTime / overlayVideo.duration) * 100;
    overlayProg.style.width = pct + '%';
    overlayThumb.style.left = pct + '%';
    var s = Math.floor(overlayVideo.currentTime || 0);
    overlayTime.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  });

  overlayBar.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!overlayVideo.duration) return;
    var r = overlayBar.getBoundingClientRect();
    overlayVideo.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * overlayVideo.duration;
  });

  // ── Visualizer ──
  var visCanvas  = document.getElementById('visualizer');
  var visCtx     = visCanvas.getContext('2d');
  var audioCtx   = null;
  var analyser   = null;
  var sourceNode = null;
  var visRaf     = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.78;
    sourceNode = audioCtx.createMediaElementSource(overlayVideo);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function startVisualizer() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    visCanvas.classList.add('active');
    var bufLen = analyser.frequencyBinCount;
    var data   = new Uint8Array(bufLen);

    function draw() {
      visRaf = requestAnimationFrame(draw);
      var W = window.innerWidth;
      var H = 96;
      visCanvas.width  = W;
      visCanvas.height = H;

      analyser.getByteFrequencyData(data);

      visCtx.clearRect(0, 0, W, H);

      var color = getComputedStyle(document.body).getPropertyValue('--text').trim() || '#111';
      visCtx.fillStyle = color;
      visCtx.globalAlpha = 0.5;

      var barCount = 80;
      var barW     = Math.floor(W / barCount) - 2;
      var step     = Math.floor(bufLen / barCount);

      for (var i = 0; i < barCount; i++) {
        var val  = data[i * step] / 255;
        var barH = Math.round(val * H * 0.9);
        var x    = i * (barW + 2);
        visCtx.fillRect(x, H - barH, barW, barH);
      }
    }
    draw();
  }

  function stopVisualizer() {
    if (visRaf) { cancelAnimationFrame(visRaf); visRaf = null; }
    visCanvas.classList.remove('active');
    visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
  }

  var activeCell = null;
  var DURATION = 800;
  var EASING = 'cubic-bezier(0.4, 0, 0.2, 1)';

  function closeOverlay() {
    if (!activeCell) return;
    var cell = activeCell;
    activeCell = null;

    overlayVideo.pause();
    stopVisualizer();
    grid.classList.remove('dimmed');

    var rect = cell.querySelector('.cell-video').getBoundingClientRect();

    // Snap to current rendered position first (may be mid-animation)
    var curLeft   = parseFloat(overlay.style.left);
    var curTop    = parseFloat(overlay.style.top);
    var curWidth  = parseFloat(overlay.style.width);
    var curHeight = parseFloat(overlay.style.height);

    overlay.style.transition = 'none';
    overlay.style.left   = curLeft + 'px';
    overlay.style.top    = curTop + 'px';
    overlay.style.width  = curWidth + 'px';
    overlay.style.height = curHeight + 'px';
    overlay.offsetHeight;

    var CLOSE_DUR = 600;
    overlay.style.transition =
      'left ' + CLOSE_DUR + 'ms ' + EASING +
      ', top ' + CLOSE_DUR + 'ms ' + EASING +
      ', width ' + CLOSE_DUR + 'ms ' + EASING +
      ', height ' + CLOSE_DUR + 'ms ' + EASING +
      ', opacity ' + CLOSE_DUR + 'ms ease';
    overlay.style.left   = rect.left + 'px';
    overlay.style.top    = rect.top  + 'px';
    overlay.style.width  = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    overlay.style.opacity = '0';

    setTimeout(function() {
      overlay.classList.remove('active');
      overlay.style.transition = '';
      overlay.style.opacity = '';
      overlayVideo.src = '';
      cell.querySelector('.cell-video').style.visibility = '';
    }, CLOSE_DUR);
  }

  overlayWrap.addEventListener('click', function() { closeOverlay(); });

  videos.forEach(function(item) {
    var cell = document.createElement('div');
    cell.className = 'cell';

    var wrap = document.createElement('div');
    wrap.className = 'cell-video';

    var v = document.createElement('video');
    v.src = item.video;
    v.preload = 'metadata';
    v.playsInline = true;
    v.loop = true;
    if (item.poster) v.poster = item.poster;
    wrap.appendChild(v);

    var icon = document.createElement('div');
    icon.className = 'icon';
    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    wrap.appendChild(icon);

    var tl = document.createElement('div'); tl.className = 'timeline';
    var timeEl = document.createElement('div'); timeEl.className = 'timeline-time'; timeEl.textContent = '0:00';
    var bar = document.createElement('div'); bar.className = 'timeline-bar';
    var prog = document.createElement('div'); prog.className = 'timeline-progress';
    var thumb = document.createElement('div'); thumb.className = 'timeline-thumb';
    bar.appendChild(prog); bar.appendChild(thumb);
    tl.appendChild(timeEl); tl.appendChild(bar);
    wrap.appendChild(tl);

    wrap.addEventListener('click', function() {
      if (activeCell === cell) { closeOverlay(); return; }
      if (activeCell) closeOverlay();

      activeCell = cell;
      var rect = wrap.getBoundingClientRect();
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var margin = 60;

      // Sync video
      overlayVideo.src = item.video;
      if (item.poster) overlayVideo.poster = item.poster;
      overlayVideo.currentTime = v.currentTime;
      overlayProg.style.width = '0%';
      overlayThumb.style.left = '0%';
      overlayTime.textContent = '0:00';

      // Place overlay exactly over cell, visible immediately
      overlay.style.transition = 'none';
      overlay.style.left   = rect.left + 'px';
      overlay.style.top    = rect.top  + 'px';
      overlay.style.width  = rect.width + 'px';
      overlay.style.height = rect.height + 'px';
      overlay.style.opacity = '1';
      overlay.classList.add('active');
      wrap.style.visibility = 'hidden';
      overlay.offsetHeight; // reflow

      // Start playing immediately at cell size
      overlayVideo.play();
      startVisualizer();
      grid.classList.add('dimmed');

      function getTargetRect() {
        var w  = window.innerWidth;
        var h  = Math.round(w * 9 / 16);
        var t  = Math.round((window.innerHeight - h) / 2);
        return { l: 0, t: t, w: w, h: h };
      }

      function applyTargetRect(animate) {
        var r = getTargetRect();
        if (animate) {
          overlay.style.transition =
            'left 300ms cubic-bezier(0.2, 0, 0.1, 1)' +
            ', top 300ms cubic-bezier(0.2, 0, 0.1, 1)' +
            ', width 300ms cubic-bezier(0.2, 0, 0.1, 1)' +
            ', height 300ms cubic-bezier(0.2, 0, 0.1, 1)';
        } else {
          overlay.style.transition = 'none';
        }
        overlay.style.left   = r.l + 'px';
        overlay.style.top    = r.t + 'px';
        overlay.style.width  = r.w + 'px';
        overlay.style.height = r.h + 'px';
      }

      applyTargetRect(true);

      function onOrientationChange() {
        if (activeCell) applyTargetRect(false);
      }
      window.addEventListener('resize', onOrientationChange);
      if (window.screen && window.screen.orientation) {
        window.screen.orientation.addEventListener('change', onOrientationChange);
      }
    });

    var info = document.createElement('div');
    info.className = 'cell-info';
    var title = document.createElement('div');
    title.className = 'cell-title';
    title.textContent = item.title || toTitle(item.video.split('/').pop());
    info.appendChild(title);
    if (item.info) {
      var meta = document.createElement('div');
      meta.className = 'cell-meta';
      meta.textContent = item.info;
      info.appendChild(meta);
    }

    cell.appendChild(wrap);
    cell.appendChild(info);
    grid.appendChild(cell);
  });
}

fetch('videos.json')
  .then(function(r) { return r.json(); })
  .then(function(cfg) {
    // Client-side transform: mirrors videos.php:26-38 logic (file -> video+poster)
    // videos.json keeps the authoring format {file,title,info} in your chosen order
    var mapped = cfg.map(function(item) {
      var file = item.file || '';
      if (!file) return null;
      var base = file.replace(/\.[^/.]+$/, '');
      // poster candidates - mirrors PHP check for jpg/jpeg/png/webp; use jpg by convention (all your videos have .jpg except Jolene)
      var poster = 'videos/' + base + '.jpg';
      return {
        video:  'videos/' + file,
        poster: poster,
        title:  item.title || '',
        info:   item.info  || ''
      };
    }).filter(Boolean);
    buildGrid(mapped);
  })
  .catch(function() {
    document.getElementById('status').textContent = 'Could not load videos.json';
  });
