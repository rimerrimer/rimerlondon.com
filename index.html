<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #f2f4e8;

  nav.rail a::after {

    transform: translateX(-50%);
    background: rgba(10,0,20,.35); border: 1px solid rgba(242,244,232,.10);
    padding: 3px 8px; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; letter-spacing: .02em; text-transform: none;
    color: rgba(242,244,232,.55); white-space: nowrap;

  .controls {

  .controls button {
    position: relative;
    font-family: system-ui, -apple-system, sans-serif; line-height: 1;
    color: rgba(242,244,232,.55); background: none; border: none;

  }
  .controls button:hover { color: #fff; text-shadow: 0 0 12px rgba(242,244,232,.6); }
  .controls button svg { width: 34px; height: 34px; display: block; }
  #skipBtn { opacity: 0; pointer-events: none; transition: opacity 1.5s ease, color .3s, text-shadow .3s; }
  #skipBtn.show { opacity: 1; pointer-events: auto; }
  .controls button::after {
    content: attr(data-label);
    position: absolute; left: 50%; top: calc(100% + 6px);
    transform: translateX(-50%);
    background: rgba(10,0,20,.35); border: 1px solid rgba(242,244,232,.10);
    padding: 3px 8px; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; letter-spacing: .02em;
    color: rgba(242,244,232,.55); white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  .controls button:hover::after, .controls button:focus-visible::after { opacity: .9; }

  #startGate { /* click disc over the spiral's centre: click toggles start/stop */
    position: fixed; left: 50%; top: 50%;
    width: min(540px, 66vw); height: min(540px, 66vw);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 20; cursor: pointer;

  #gateIcon { color: var(--ink); opacity: .75; filter: drop-shadow(0 0 18px rgba(242,244,232,.25)); }

  @media (max-width: 620px) {

  }
  @media (prefers-reduced-motion: reduce) {
    nav.rail { animation: none; opacity: 1; }

  }

<script>
  // shuffled rotation, shared with the module via window.__queue (everything in au/, URLs encoded)
  const __TRACKS = [
    'au/1.m4a', 'au/2.1.m4a', 'au/3.m4a', 'au/4.m4a',
    'au/bad%20sleep%231.m4a', 'au/BDBDBD.m4a', 'au/amb%20jv880%20pooha%2026aug23.mp3'
  ];
  function __shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
  }
  let __first = true;
  try { __first = !localStorage.getItem('rl-au-visited'); } catch (e) {}
  if (__first) { // very first visit: open with 1.m4a, shuffle the rest after it
    window.__queue = __TRACKS.filter(t => t !== 'au/1.m4a');
    __shuffle(window.__queue);
    window.__queue.unshift('au/1.m4a');
    try { localStorage.setItem('rl-au-visited', '1'); } catch (e) {}
  } else {
    window.__queue = __TRACKS.slice();
    __shuffle(window.__queue);
  }
  const __au = document.getElementById('au');
  __au.src = window.__queue[0]; // preloaded; playback starts on the CLICK gate (no autoplay)
</script>

<script type="module">
import * as THREE from 'three';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduced ? 0 : 0.8;        // tunnel travel (slow)
const SPIN = reduced ? 0 : 0.035;       // spiral rotation (rad/s)
const SPAN = 270;

const container = document.getElementById('forest');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) { throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 0);

const tunnel = new THREE.Group();
scene.add(tunnel);

/* ---------- neon rings spiralling into the distance ---------- */
const RINGS = 90;
const rings = [];
const ringGeo = new THREE.TorusGeometry(7.5, 0.07, 8, 72);
const col = new THREE.Color();
for (let i = 0; i < RINGS; i++) {
  col.setHSL((i * 0.045) % 1, 1, 0.62);
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: col.clone(), transparent: true, opacity: 0.85 }));
  m.position.z = 4 - (i / RINGS) * SPAN;
  m.rotation.z = i * 0.42;
  m.userData.spin = 0.1 + (i % 5) * 0.03;
  tunnel.add(m);
  rings.push(m);
}

/* ---------- helix tubes (3 intertwined spirals) ---------- */
function helixTube(phase, color) {
  const pts = [];
  for (let z = 0; z >= -SPAN; z -= 6) {
    const a = phase + z * 0.055;
    pts.push(new THREE.Vector3(Math.cos(a) * 7.5, Math.sin(a) * 7.5, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 220, 0.09, 6, false);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
}
const helices = [helixTube(0, 0xff4ecd), helixTube(2.1, 0x4dffd2), helixTube(4.2, 0xffe14d)];
helices.forEach(h => tunnel.add(h));

/* ---------- spiral starfield ---------- */
const N = 14000;
const pos = new Float32Array(N * 3), clr = new Float32Array(N * 3), zz = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const z = 4 - Math.random() * SPAN;
  const a = i * 0.11 + z * 0.06;
  const r = 1.2 + (i % 90) * 0.085;
  zz[i] = z;
  pos[i * 3] = Math.cos(a) * r;
  pos[i * 3 + 1] = Math.sin(a) * r;
  pos[i * 3 + 2] = z;
  // stars: white / blue-white / warm, low saturation
  const warm = Math.random() < 0.25;
  col.setHSL(warm ? 0.11 : 0.58 + Math.random() * 0.08, Math.random() * 0.35, 0.72 + Math.random() * 0.26);
  clr[i * 3] = col.r; clr[i * 3 + 1] = col.g; clr[i * 3 + 2] = col.b;
}
const baseClr = clr.slice(); // rest colors; audio brightens scattered stars above these
for (let i = 0; i < clr.length; i++) clr[i] = baseClr[i] * 0.5; // initial frame = shine floor: no pop on start
const twPhase = new Float32Array(N), twSpeed = new Float32Array(N), twAmp = new Float32Array(N);
const sEnv = new Float32Array(N), sThr = new Float32Array(N), sAtk = new Float32Array(N), sRel = new Float32Array(N);
for (let i = 0; i < N; i++) {
  twPhase[i] = Math.random() * Math.PI * 2;
  twSpeed[i] = 0.8 + Math.random() * 2.2;   // each star twinkles at its own rate
  twAmp[i] = Math.pow(Math.random(), 1.5) * 6; // many react, some erupt like fireworks
  sThr[i] = 0.06 + Math.random() * 0.4;       // hair trigger — very sensitive
  sAtk[i] = 0.5 + Math.random() * 0.5;        // snappy attack
  sRel[i] = 0.004 + Math.random() * 0.018;    // long firework tails
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(clr, 3));
const dotCanvas = document.createElement('canvas'); dotCanvas.width = dotCanvas.height = 128;
{
  const dg = dotCanvas.getContext('2d');
  const dgrad = dg.createRadialGradient(64, 64, 0, 64, 64, 64);
  dgrad.addColorStop(0, 'rgba(255,255,255,1)');
  dgrad.addColorStop(0.25, 'rgba(255,255,255,.95)');
  dgrad.addColorStop(0.42, 'rgba(255,255,255,.45)');
  dgrad.addColorStop(1, 'rgba(255,255,255,0)');
  dg.fillStyle = dgrad; dg.fillRect(0, 0, 128, 128);
}
const vortex = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.06, map: new THREE.CanvasTexture(dotCanvas), vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false }));
scene.add(vortex); // outside the tunnel: the bass scale-pulse must not move stars (they only shine)

/* ---------- icon stars: a few stars occasionally become a slow-spinning icon ---------- */
function iconTex(emoji) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.font = '96px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,255,255,.5)'; g.shadowBlur = 8;
  g.fillText(emoji, 64, 70);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}
const iconTexes = ['🎷', '🌀', '👽', '🪐', '🍄', '🐓', '🌚', '✨', '❄️', '🧄', '🧅', '🐠', '🔝', '👍'].map(iconTex);
const saxPool = [];
for (let i = 0; i < 4; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: iconTexes[0], transparent: true, opacity: 0, depthWrite: false, color: 0xffffff }));
  scene.add(sp);
  saxPool.push({ sp, state: 'wait', timer: 2 + Math.random() * 6, life: 0, spin: (0.12 + Math.random() * 0.2) * (Math.random() < .5 ? -1 : 1) });
}
function updateSax(dt, d) {
  for (const s of saxPool) {
    if (s.state === 'wait') {
      s.timer -= dt;
      if (s.timer <= 0) {
        const z = -12 - Math.random() * 20; // near field: visible right away
        const a = Math.random() * Math.PI * 2 + z * 0.06;
        const r = 2.5 + Math.random() * 5.0; // spread well out from the centre
        s.sp.position.set(Math.cos(a) * r, Math.sin(a) * r, z);
        s.sp.material.map = iconTexes[(Math.random() * iconTexes.length) | 0];
        s.sp.material.needsUpdate = true;
        const h = 0.45 + Math.random() * 0.3; // small at spawn...
        s.z0 = z; s.baseH = h;
        s.sp.scale.set(h * 0.5, h * 0.5, 1); // ...growing as it nears (see below)
        s.sp.material.rotation = Math.random() * Math.PI * 2;
        s.life = 0; s.state = 'in';
      }
    } else {
      s.sp.position.z += SPEED * d * (starVel + 0.3); // drifts with the stars, guaranteed minimum pace
      s.sp.material.rotation += s.spin * d;   // slow spin
      const k = Math.min(1, Math.max(0, 1 + s.sp.position.z / -s.z0)); // 0 at spawn → 1 at camera
      const sc = s.baseH * (0.5 + 1.2 * k); // grows bigger as it nears you
      s.sp.scale.set(sc, sc, 1);
      if (s.state === 'in') {
        s.life += dt / 3;
        s.sp.material.opacity = Math.min(0.85, s.life * 0.85);
        if (s.life >= 1) { s.state = 'hold'; s.life = 0; }
      } else if (s.state === 'hold') {
        // stays a sax star until it drifts out of view (past the camera)
        if (s.sp.position.z > 6) { s.state = 'wait'; s.timer = 8 + Math.random() * 20; s.sp.material.opacity = 0; }
      }
    }
  }
}

/* ---------- centre glow ---------- */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,.95)');
  grad.addColorStop(0.25, 'rgba(255,78,205,.35)');
  grad.addColorStop(1, 'rgba(255,78,205,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), transparent: true, opacity: 0.62, depthWrite: false }));
glow.scale.setScalar(9);
glow.position.z = -30;
scene.add(glow);

/* ---------- fine film dust (1:1 pixels, jittered tile) ---------- */
const grainEl = document.getElementById('grain');
const tile = document.createElement('canvas');
const TS = 256;
tile.width = tile.height = TS;
const tg = tile.getContext('2d');
const grainImg = tg.createImageData(TS, TS);
let lastGrain = 0;
function drawGrain(now) {
  if (reduced || now - lastGrain < 220) return;
  lastGrain = now;
  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = Math.random();
    let v;
    if (r < .04) v = (Math.random() * 50) | 0;                    // sparse dark specks
    else if (r < .08) v = 205 + ((Math.random() * 50) | 0);      // sparse light specks
    else v = 80 + ((Math.random() * 95) | 0);                    // gentle mid noise
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  tg.putImageData(grainImg, 0, 0);
  // per-frame dust clumps + hairs (jitter with the tile = moving film dirt)
  tg.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.4)' : 'rgba(255,255,255,.35)';
  for (let s = 0; s < 6; s++) tg.fillRect(Math.random() * TS, Math.random() * TS, 1.5 + Math.random(), 1.5 + Math.random());
  if (Math.random() < .5) {
    tg.strokeStyle = Math.random() < .5 ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.26)';
    tg.lineWidth = 1;
    const x = Math.random() * TS;
    tg.beginPath(); tg.moveTo(x, Math.random() * 30); tg.lineTo(x + (Math.random() * 4 - 2), TS); tg.stroke();
  }
  grainEl.style.backgroundImage = `url(${tile.toDataURL()})`;
  grainEl.style.backgroundSize = `${TS}px ${TS}px`;
  grainEl.style.backgroundPosition = `${-(Math.random() * TS) | 0}px ${-(Math.random() * TS) | 0}px`;
  grainEl.style.opacity = String(0.24 + Math.random() * 0.12); // projector flicker
}

/* static grime at finer resolution: smudges, scanlines, baked dust (drawn once) */
{
  const dirt = document.getElementById('dirt');
  const dg = dirt.getContext('2d');
  const D = 1024;
  dirt.width = D; dirt.height = D;
  dg.fillStyle = 'rgba(52,34,16,.10)'; dg.fillRect(0, 0, D, D); // warm aged wash + lifted blacks
  for (let i = 0; i < 40; i++) {                                 // smeared blotches
    const x = Math.random() * D, y = Math.random() * D, r = 40 + Math.random() * 180;
    const g = dg.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() < .6;
    g.addColorStop(0, dark ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    dg.fillStyle = g; dg.beginPath(); dg.arc(x, y, r, 0, 7); dg.fill();
  }
  dg.fillStyle = 'rgba(0,0,0,.14)';                              // scanlines
  for (let y = 0; y < D; y += 4) dg.fillRect(0, y, D, 1);
  dg.globalAlpha = .30;                                          // fine baked dust (noisy blacks)
  for (let i = 0; i < 8000; i++) {
    dg.fillStyle = Math.random() < .55 ? '#000' : '#fff';
    dg.fillRect(Math.random() * D, Math.random() * D, 1.5, 1.5);
  }
  dg.globalAlpha = .22; dg.strokeStyle = '#fff'; dg.lineWidth = 1.5;
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * D;
    dg.beginPath(); dg.moveTo(x, Math.random() * 160); dg.lineTo(x + 6, D); dg.stroke();
  }
  dg.globalAlpha = .5;                                          // dirty edges (uneven ring)
  for (let i = 0; i < 260; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = D * (0.52 + Math.random() * 0.10);
    const x = D / 2 + Math.cos(a) * rr, y = D / 2 + Math.sin(a) * rr;
    dg.fillStyle = Math.random() < .65 ? '#000' : '#fff';
    dg.fillRect(x, y, 2 + Math.random() * 5, 2 + Math.random() * 5);
  }
  dg.globalAlpha = 1;
}

/* ---------- background music + audio reactivity ---------- */
const skipBtn = document.getElementById('skipBtn');
let cur = document.getElementById('au');
let spare = new Audio();
spare.preload = 'auto';
function shuffled(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
let queue = (window.__queue && window.__queue.length) ? window.__queue.slice() : ['au/1.m4a'];
let qi = 0; // queue[0] is already set + playing from the inline script

// Skip crossfade: new track in (~3s), previous out over ~40s.
const fadingOut = new Set();
const fadeTimers = new Map();
function fadeTo(el, target, ms, done) {
  if (fadeTimers.has(el)) cancelAnimationFrame(fadeTimers.get(el));
  const from = el.volume, t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / ms);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; // ease in-out, per-frame smooth
    el.volume = from + (target - from) * e;
    if (k < 1) fadeTimers.set(el, requestAnimationFrame(step));
    else { fadeTimers.delete(el); if (done) done(); }
  };
  fadeTimers.set(el, requestAnimationFrame(step));
}
function nextTrack(manual) {
  qi++;
  if (qi >= queue.length) { queue = shuffled(queue); qi = 0; } // reshuffle when the queue runs out
  const file = queue[qi];
  if (manual && audioOn && !cur.paused) {
    const old = cur, incoming = spare;
    fadingOut.add(old); fadingOut.delete(incoming);
    incoming.src = file;
    incoming.volume = 0;
    incoming.play().catch(() => {});
    fadeTo(incoming, 1, 3000);
    fadeTo(old, 0, 25000, () => { old.pause(); old.removeAttribute('src'); old.load(); fadingOut.delete(old); });
    cur = incoming; spare = old;
  } else {
    cur.src = file;
    cur.play().catch(() => {});
  }
}
for (const el of [cur, spare]) {
  el.addEventListener('ended', () => {
    if (el === cur && !fadingOut.has(el)) nextTrack(false);
  });
}

/* ---------- generative samples (very sparse, random pitch/pan) ---------- */
const SAMPLE_FILES = ['au/samples/welcome.mp3']; // add names here as files are added
const sampleBufs = [];
let sampleTimer = null;
let sctx = null; // own context (stays suspended until first gesture; never silences the track)
try { sctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
async function loadSamples() {
  if (sampleBufs.length || !sctx) return;
  for (const f of SAMPLE_FILES) {
    try {
      const res = await fetch(f);
      const buf = await sctx.decodeAudioData(await res.arrayBuffer());
      sampleBufs.push(buf);
    } catch (e) {}
  }
  if (sampleBufs.length && !sampleTimer) scheduleSample(true);
}
loadSamples();
scheduleSample(true); // arm immediately — falls back to media playback even before decode finishes
addEventListener('pointerdown', () => { if (sctx && sctx.state !== 'running') sctx.resume(); });
// Fallback route: plain media element (like the music) — needs no AudioContext,
// so it can fire on schedule whenever the browser permits media autoplay.
// Used while the panning context is still suspended.
let sfxEl = null;
function playSampleMedia() {
  try {
    if (!sfxEl) {
      sfxEl = new Audio();
      sfxEl.preservesPitch = false; sfxEl.mozPreservesPitch = false; sfxEl.webkitPreservesPitch = false; // speed moves pitch too
    }
    sfxEl.src = SAMPLE_FILES[(Math.random() * SAMPLE_FILES.length) | 0];
    sfxEl.playbackRate = 0.5 + Math.random() * 0.6; // -50% … +10% speed (and pitch)
    sfxEl.volume = 0.6;
    sfxEl.play().catch(() => {});
  } catch (e) {}
}
function scheduleSample(first) {
  clearTimeout(sampleTimer);
  sampleTimer = setTimeout(triggerSample, first ? 3000 + Math.random() * 7000 : 15000 + Math.random() * 35000); // first 3–10s, then every 15–50s
}
function triggerSample() {
  if (document.hidden) { scheduleSample(true); return; } // retry soon once visible
  if (sctx && sctx.state === 'running' && sampleBufs.length) {
    try {
      const buf = sampleBufs[(Math.random() * sampleBufs.length) | 0];
      const src = sctx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = 0.5 + Math.random() * 0.6;  // -50% … +10% speed
      const pan = sctx.createStereoPanner ? sctx.createStereoPanner() : sctx.createGain();
      if (pan.pan) pan.pan.value = Math.random() * 2 - 1;  // full range
      const g = sctx.createGain();
      const peak = 0.6, now = sctx.currentTime;
      const realDur = buf.duration / src.playbackRate.value; // rate stretches/shortens playback
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(peak, now + 0.03);
      g.gain.setValueAtTime(peak, now + Math.max(0.03, realDur - 0.1));
      g.gain.linearRampToValueAtTime(0, now + realDur + 0.05);
      src.connect(g); g.connect(pan); pan.connect(sctx.destination);
      src.start(now);
      src.stop(now + realDur + 0.1);
    } catch (e) {}
  } else {
    playSampleMedia(); // context asleep (no gesture yet) — still plays, unpanned
  }
  scheduleSample();
}

let actx = null, analyser = null, freq = null, audioOn = false;
let bass = 0, mid = 0, treb = 0, bassTrail = 0, spiralEnv = 0;
// Built on first gesture: until then the <audio> element plays direct to the
// speakers, so it can autoplay whenever the browser allows it (an AudioContext
// created pre-gesture would keep it silenced).
function startAudio() {
  if (audioOn) { if (actx) actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 1024; // ~43Hz per bin — fine enough to isolate the sub-100Hz low end
    for (const el of [cur, spare]) {
      const src = actx.createMediaElementSource(el);
      src.connect(analyser);
    }
    analyser.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    audioOn = true;
  } catch (e) {}
  loadSamples();
  if (cur.paused) cur.play().catch(() => {});
}
skipBtn.addEventListener('click', () => { startAudio(); nextTrack(true); });

// controls barely visible until the mouse moves
const controls = document.querySelector('.controls');
let idleTimer = null;
function wakeControls() {
  controls.classList.add('on');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => controls.classList.remove('on'), 2500);
}
addEventListener('mousemove', wakeControls);
// first click anywhere unlocks audio (but not on the control buttons —
// their own handlers decide, otherwise pointerdown+click would start then pause)
let unlocked = false;
addEventListener('pointerdown', (e) => {
  if (unlocked || (e.target && e.target.closest && e.target.closest('button'))) return;
  unlocked = true;
  startAudio();
});

// Centre click toggles start/stop (smooth ramp-up / ramp-down), icon alternates play/pause
const gate = document.getElementById('startGate');
const gateIcon = document.getElementById('gateIcon');
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.6"/><path d="M9 7l7 5-7 5z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.6"/><rect x="8" y="7" width="3" height="10" fill="currentColor"/><rect x="13" y="7" width="3" height="10" fill="currentColor"/></svg>';
gate.addEventListener('pointerdown', () => {
  started = !started;
  levelTarget = started ? 1 : 0;
  if (started) {
    cur.volume = 0;
    startAudio();
    cur.play().catch(() => {});
    fadeTo(cur, 1, 2500); // smooth slow start
    gateIcon.innerHTML = ICON_PAUSE;
    gate.setAttribute('aria-label', 'Click the centre to stop');
    skipBtn.classList.add('show'); // next button fades in once playing
  } else {
    fadeTo(cur, 0, 1400, () => { cur.pause(); spare.pause(); }); // halt
    gateIcon.innerHTML = ICON_PLAY;
    gate.setAttribute('aria-label', 'Click the centre to start');
    skipBtn.classList.remove('show');
  }
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let t = 0;
let started = false, level = 0, levelTarget = 0; // visuals eased by level (0 = loaded & still)
let starVel = 0.15, starTarget = 0.15, starTimer = 4;
let weaveX = 0, weaveY = 0, weaveTx = 0, weaveTy = 0, weaveTimer = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  level += (levelTarget - level) * Math.min(1, dt * 0.7); // eases up or down over ~2–3s
  const d = dt * (0.1 + 0.9 * level); // 10% creep at rest, full speed while playing
  t += d;

  if (analyser && freq) {
    analyser.getByteFrequencyData(freq);
    const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += freq[i]; return s / ((b - a) * 255); };
    bass += (avg(1, 4) - bass) * 0.3;   // low end (~43–150 Hz) — drives the spiral's vibration
    mid += (avg(3, 10) - mid) * 0.26;    // low-mids (~130–430 Hz)
    treb += (avg(47, 180) - treb) * 0.22; // highs (2 kHz+)
  }
  bassTrail += (bass - bassTrail) * 0.01; // slow trail of the low end
  const onset = Math.max(0, bass - bassTrail); // sudden low-end rise above recent level — drones give ~0
  const od = Math.min(1, Math.max(0, (onset - 0.004) * 14));
  const pulse = od * od; // strong on short low hits, silent on sustained loud
  spiralEnv += (pulse - spiralEnv) * (pulse > spiralEnv ? 0.45 : 0.03); // release: linger a bit longer, then die out
  if (!analyser || !freq) {
    // before the first gesture there is no frequency data yet (the analyser
    // graph attaches on click) — keep the scene gently alive until then
    bass = Math.max(0, 0.25 + 0.2 * Math.sin(t * 1.3) * Math.sin(t * 0.7));
    mid = Math.max(0, 0.25 + 0.2 * Math.sin(t * 0.9 + 2));
    treb = Math.max(0, 0.2 + 0.18 * Math.sin(t * 2.3));
  }

  tunnel.rotation.z += SPIN * d * (1 + mid * 0.5);         // spin surges with mids
  vortex.rotation.z = tunnel.rotation.z;                   // stars share the swirl, not the pulse
  // (vibration is per-ring, centre-weighted below — no uniform pulse/jitter; stars stay still)
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    r.position.z += SPEED * d * (1 + spiralEnv * 0.5);     // tunnel rushes on peaks (lingering)
    if (r.position.z > 6) r.position.z -= SPAN;
    r.rotation.z += r.userData.spin * d * 0.2 * (1 + mid * 0.4);
    const w = Math.exp(i / (rings.length - 1) * 3 - 3); // log-family: sharply centre-weighted, edge inert
    r.scale.setScalar(1 + level * spiralEnv * 0.15 * w * Math.sin(i * 0.9 + t * 12));
  }
  starTimer -= dt;
  if (starTimer <= 0) {
    const r = Math.random();
    starTarget = r < 0.25 ? 0.002 + Math.random() * 0.01 : r < 0.5 ? 1.2 + Math.random() * 1.3 : 0.05 + Math.random() * 0.5;
    starTimer = 6 + Math.random() * 12;
  }
  starVel += (starTarget - starVel) * Math.min(1, dt * 0.3);
  const p = pGeo.attributes.position.array;
  for (let i = 0; i < N; i++) {
    zz[i] += SPEED * d * starVel;                           // drift at the wandering speed
    if (zz[i] > 5) zz[i] -= SPAN;
    p[i * 3 + 2] = zz[i];
  }
  pGeo.attributes.position.needsUpdate = true;
  // per-star shine: each star has its own threshold + attack/decay rates,
  // so hits sparkle scattered individual stars, not the whole field at once
  const c = pGeo.attributes.color.array;
  for (let i = 0; i < N; i++) {
    const e = sEnv[i];
    const target = treb > sThr[i] ? treb : 0;
    sEnv[i] = e + (target - e) * (target > e ? sAtk[i] : sRel[i]);
    const tw = 0.5 + 0.5 * Math.sin(t * twSpeed[i] + twPhase[i]); // scattered twinkle
    const m = 0.5 + level * sEnv[i] * twAmp[i] * (0.75 + 0.25 * tw); // half visible at rest, fireworks on hits
    c[i * 3] = baseClr[i * 3] * m; c[i * 3 + 1] = baseClr[i * 3 + 1] * m; c[i * 3 + 2] = baseClr[i * 3 + 2] * m;
  }
  pGeo.attributes.color.needsUpdate = true;
  updateSax(dt, d);

  // camera fixed at the origin: the spiral stays dead-centred on screen (so the centre icon exactly lines up)
  glow.material.opacity = 0.62 + level * (Math.sin(t * 0.45) * 0.02 + bass * 0.15 + treb * 0.08);
  if (!reduced) { // slow gate weave (wandering, like film in the gate) + flicker
    weaveTimer -= dt;
    if (weaveTimer <= 0) {
      weaveTx = Math.random() * 5 - 2.5; weaveTy = Math.random() * 5 - 2.5;
      weaveTimer = 0.6 + Math.random() * 1.6;
    }
    weaveX += (weaveTx - weaveX) * Math.min(1, dt * 2.2);
    weaveY += (weaveTy - weaveY) * Math.min(1, dt * 2.2);
    renderer.domElement.style.transform = `translate(${(weaveX * level).toFixed(2)}px, ${(weaveY * level).toFixed(2)}px)`;
    glow.material.opacity *= 1 + level * (Math.random() * 0.07 - 0.04);
  }

  drawGrain(now);
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
