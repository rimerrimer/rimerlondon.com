<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rimer London</title>
<link rel="icon" href="favicon.ico">
<meta name="description" content="Rimer London — music, film and sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #f2f4e8;
    --ink-dim: rgba(242,244,232,.62);
  }
  html, body { height: 100%; }
  body {
    font-family: 'VT323', monospace;
    color: var(--ink);
    overflow: hidden;
    background: radial-gradient(80% 60% at 50% 50%, #1a0533 0%, #0a0014 70%);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  #forest { position: fixed; inset: 0; }
  #forest canvas {
    display: block; width: 100%; height: 100%;
    animation: hue 40s linear infinite;
  }
  @keyframes hue { to { filter: hue-rotate(360deg); } }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(70% 60% at 50% 50%, transparent 55%, rgba(5,0,14,.72) 100%);
  }

  #grain {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 30; opacity: .055; mix-blend-mode: overlay;
    image-rendering: pixelated;
  }

  nav.rail {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px clamp(14px, 3vw, 34px);
    max-width: min(94vw, 900px);
    opacity: 0; animation: riseC 1.6s 1s ease forwards;
  }
  nav.rail a {
    font-size: 23px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-dim); text-decoration: none; padding: 8px 2px;
    transition: color .3s, text-shadow .3s;
  }
  nav.rail a:nth-child(1):hover { color: #ff6ec7; text-shadow: 0 0 14px #ff6ec7; }
  nav.rail a:nth-child(2):hover { color: #ffe14d; text-shadow: 0 0 14px #ffe14d; }
  nav.rail a:nth-child(3):hover { color: #4dffd2; text-shadow: 0 0 14px #4dffd2; }
  nav.rail a:nth-child(4):hover { color: #4d7cff; text-shadow: 0 0 14px #4d7cff; }
  nav.rail a:nth-child(5):hover { color: #c44dff; text-shadow: 0 0 14px #c44dff; }
  nav.rail a:nth-child(6):hover { color: #ff8f3c; text-shadow: 0 0 14px #ff8f3c; }
  nav.rail a:nth-child(7):hover { color: #7dff4d; text-shadow: 0 0 14px #7dff4d; }
  nav.rail a:focus-visible { color: var(--ink); outline: none; }
  nav.rail a { position: relative; }
  nav.rail a::after {
    content: attr(data-label);
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%);
    background: rgba(10,0,20,.35); border: 1px solid rgba(242,244,232,.10);
    padding: 1px 8px; font-size: 16px; letter-spacing: .06em;
    color: rgba(242,244,232,.55); white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  nav.rail a:hover::after, nav.rail a:focus-visible::after { opacity: .9; }
  nav.rail a svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.rail a svg .fill { fill: currentColor; stroke: none; }

  @keyframes riseC { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 620px) {
    nav.rail { gap: 2px 18px; bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    nav.rail { animation: none; opacity: 1; }
    #forest canvas { animation: none; }
  }
</style>
</head>
<body>

<h1 class="sr-only">Rimer London</h1>
<div id="forest" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<canvas id="grain" aria-hidden="true"></canvas>

<!-- Navigation (keyboard, touch, no-WebGL fallback). -->
<nav class="rail" aria-label="Links">
  <a href="https://soundcloud.com/rimer" target="_blank" rel="noopener" aria-label="SoundCloud" data-label="SoundCloud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A5.5 5.5 0 0 1 18.5 10 3.5 3.5 0 0 1 17.5 18H7z"/></svg>
  </a>
  <a href="https://www.mixcloud.com/rimer-london/" target="_blank" rel="noopener" aria-label="Mixcloud" data-label="Mixcloud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A5.5 5.5 0 0 1 18.5 10 3.5 3.5 0 0 1 17.5 18H7z"/><path class="fill" d="M10.5 12.5v4l3.5-2z"/></svg>
  </a>
  <a href="https://music.apple.com/nl/artist/rimer-london/351480381" target="_blank" rel="noopener" aria-label="Apple Music" data-label="Apple Music">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5V7l10-2v11.5"/><circle cx="6.8" cy="18.5" r="2.2"/><circle cx="16.8" cy="16.5" r="2.2"/></svg>
  </a>
  <a href="https://open.spotify.com/artist/4Kdb6rwgdSPx0P2AUhvdee" target="_blank" rel="noopener" aria-label="Spotify" data-label="Spotify">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 10.2c2.8-1 6-1 8.5.2M8.3 13c2.3-.7 4.8-.6 7 .3M8.8 15.7c1.9-.5 3.8-.4 5.7.3"/></svg>
  </a>
  <a href="https://instagram.com/rimerlondon" target="_blank" rel="noopener" aria-label="Instagram" data-label="Instagram">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle class="fill" cx="17.2" cy="6.8" r="1" stroke="none"/></svg>
  </a>
  <a href="/portfolio" data-label="portfolio">Work$</a>
</nav>

<noscript>
  <p style="position:fixed;inset:auto 0 120px;text-align:center;z-index:11">Rimer London — use the links below.</p>
</noscript>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduced ? 0 : 1.6;        // tunnel travel (slow)
const SPIN = reduced ? 0 : 0.07;        // spiral rotation (rad/s)
const SPAN = 270;

const container = document.getElementById('forest');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) { throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 0);

const tunnel = new THREE.Group();
scene.add(tunnel);

/* ---------- neon rings spiralling into the distance ---------- */
const RINGS = 90;
const rings = [];
const ringGeo = new THREE.TorusGeometry(7.5, 0.07, 8, 72);
const col = new THREE.Color();
for (let i = 0; i < RINGS; i++) {
  col.setHSL((i * 0.045) % 1, 1, 0.62);
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: col.clone(), transparent: true, opacity: 0.85 }));
  m.position.z = 4 - (i / RINGS) * SPAN;
  m.rotation.z = i * 0.42;
  m.userData.spin = 0.1 + (i % 5) * 0.03;
  tunnel.add(m);
  rings.push(m);
}

/* ---------- helix tubes (3 intertwined spirals) ---------- */
function helixTube(phase, color) {
  const pts = [];
  for (let z = 0; z >= -SPAN; z -= 6) {
    const a = phase + z * 0.055;
    pts.push(new THREE.Vector3(Math.cos(a) * 7.5, Math.sin(a) * 7.5, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 220, 0.09, 6, false);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
}
tunnel.add(helixTube(0, 0xff4ecd), helixTube(2.1, 0x4dffd2), helixTube(4.2, 0xffe14d));

/* ---------- spiral particle vortex ---------- */
const N = 2400;
const pos = new Float32Array(N * 3), clr = new Float32Array(N * 3), zz = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const z = 4 - Math.random() * SPAN;
  const a = i * 0.11 + z * 0.06;
  const r = 1.2 + (i % 90) * 0.085;
  zz[i] = z;
  pos[i * 3] = Math.cos(a) * r;
  pos[i * 3 + 1] = Math.sin(a) * r;
  pos[i * 3 + 2] = z;
  col.setHSL(((i * 0.013) % 1), 1, 0.65);
  clr[i * 3] = col.r; clr[i * 3 + 1] = col.g; clr[i * 3 + 2] = col.b;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(clr, 3));
const dotCanvas = document.createElement('canvas'); dotCanvas.width = dotCanvas.height = 32;
{
  const dg = dotCanvas.getContext('2d');
  const dgrad = dg.createRadialGradient(16, 16, 0, 16, 16, 16);
  dgrad.addColorStop(0, 'rgba(255,255,255,1)');
  dgrad.addColorStop(0.5, 'rgba(255,255,255,.4)');
  dgrad.addColorStop(1, 'rgba(255,255,255,0)');
  dg.fillStyle = dgrad; dg.fillRect(0, 0, 32, 32);
}
const vortex = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.28, map: new THREE.CanvasTexture(dotCanvas), vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false }));
tunnel.add(vortex);

/* ---------- centre glow ---------- */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,.95)');
  grad.addColorStop(0.25, 'rgba(255,78,205,.35)');
  grad.addColorStop(1, 'rgba(255,78,205,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), transparent: true, opacity: 0.8, depthWrite: false }));
glow.scale.setScalar(9);
glow.position.z = -30;
scene.add(glow);

/* ---------- flying title letters along the spiral ---------- */
try { await document.fonts.load('90px "Press Start 2P"', 'RIMERLONDON'); } catch (e) {}

function textSprite(text, fontPx, hue, worldH) {
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  g.font = `${fontPx}px "Press Start 2P", monospace`;
  const w = Math.ceil(g.measureText(text).width) + 40;
  c.width = w; c.height = fontPx + 40;
  const ctx = c.getContext('2d');
  ctx.font = `${fontPx}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = `hsla(${hue * 360},100%,65%,.9)`; ctx.shadowBlur = 22;
  ctx.lineWidth = 10; ctx.strokeStyle = '#12001f'; ctx.lineJoin = 'round';
  ctx.strokeText(text, c.width / 2, c.height / 2);
  ctx.fillStyle = `hsl(${hue * 360},100%,68%)`;
  ctx.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(worldH * (c.width / c.height), worldH, 1);
  return sp;
}

const floaters = [];   // { sp, t (0=far..1=near), radius, phase }
{
  // Letters grouped as word-trains (RIMER, then LONDON after a gap),
  // duplicated half a cycle apart so a word is always on approach.
  // R leads: first letter is nearest, so R I M E R L O N D O N arrives in order.
  const words = ['RIMER', 'LONDON'];
  for (let w = 0; w < words.length; w++) {
    for (let i = 0; i < words[w].length; i++) {
      const rev = words[w].length - 1 - i;
      // RIMER (w=0) sits nearer (higher t) so it arrives before LONDON.
      // Compressed t-range = longer empty pause between passes.
      const tBase = (1 - w) * 0.09 + rev * 0.012;
      const phase = (1 - w) * 0.9 + rev * 0.24;
      for (let copy = 0; copy < 2; copy++) {
        const sp = textSprite(words[w][i], 90, (w * 0.3 + i * 0.09 + copy * 0.5) % 1, 2.4);
        const f = { sp, t: (tBase + copy * 0.5) % 1, radius: 5.0, phase };
        floaters.push(f); tunnel.add(sp);
      }
    }
  }
}

/* ---------- film grain ---------- */
const grain = document.getElementById('grain');
const gg = grain.getContext('2d');
grain.width = 256; grain.height = 256;
const grainImg = gg.createImageData(256, 256);
let lastGrain = 0;
function drawGrain(now) {
  if (reduced || now - lastGrain < 90) return;
  lastGrain = now;
  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gg.putImageData(grainImg, 0, 0);
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let t = 0, lettersPaused = false;
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); lettersPaused = !lettersPaused; }
});
function tick(now) {
  requestAnimationFrame(tick);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  tunnel.rotation.z += SPIN * dt;
  for (const r of rings) {
    r.position.z += SPEED * dt;
    if (r.position.z > 6) r.position.z -= SPAN;
    r.rotation.z += r.userData.spin * dt * 0.4;
  }
  const p = pGeo.attributes.position.array;
  for (let i = 0; i < N; i++) {
    zz[i] += SPEED * dt;
    if (zz[i] > 5) zz[i] -= SPAN;
    p[i * 3 + 2] = zz[i];
  }
  pGeo.attributes.position.needsUpdate = true;

  for (const f of floaters) {
    if (!lettersPaused) f.t += (SPEED / SPAN) * dt * 1.8;
    if (f.t > 1) f.t -= 1;
    const z = -260 + f.t * 266;
    const a = f.phase + f.t * 7.5;         // twist as it approaches = spiral
    f.sp.position.set(Math.cos(a) * f.radius, Math.sin(a) * f.radius, z);
    f.sp.material.opacity = Math.min(1, f.t * 9, (1 - f.t) * 7);
  }

  camera.position.x = Math.sin(t * 0.2) * 0.35;
  camera.position.y = Math.cos(t * 0.16) * 0.35;
  camera.lookAt(0, 0, -20);
  glow.material.opacity = 0.65 + Math.sin(t * 0.9) * 0.15;

  drawGrain(now);
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
