<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rimer London</title>
<link rel="icon" href="favicon.ico">
<meta name="description" content="Rimer London — music, film and sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #f2f4e8;
    --ink-dim: rgba(242,244,232,.62);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
    overflow: hidden;
    background: radial-gradient(80% 60% at 50% 50%, #1a0533 0%, #0a0014 70%);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  #forest { position: fixed; inset: 0; }
  #forest canvas {
    display: block; width: 100%; height: 100%;
  }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(70% 60% at 50% 50%, transparent 55%, rgba(5,0,14,.72) 100%);
  }

  #grain {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 30; opacity: .055; mix-blend-mode: overlay;
    image-rendering: pixelated;
  }

  nav.rail {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px clamp(14px, 3vw, 34px);
    max-width: min(94vw, 900px);
    opacity: 0; animation: riseC 1.6s 1s ease forwards;
  }
  nav.rail a {
    font-size: 21px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-dim); text-decoration: none; padding: 8px 2px;
    transition: color .3s, text-shadow .3s;
  }
  nav.rail a:nth-child(1):hover { color: #ff6ec7; text-shadow: 0 0 14px #ff6ec7; }
  nav.rail a:nth-child(2):hover { color: #ffe14d; text-shadow: 0 0 14px #ffe14d; }
  nav.rail a:nth-child(3):hover { color: #4dffd2; text-shadow: 0 0 14px #4dffd2; }
  nav.rail a:nth-child(4):hover { color: #4d7cff; text-shadow: 0 0 14px #4d7cff; }
  nav.rail a:nth-child(5):hover { color: #c44dff; text-shadow: 0 0 14px #c44dff; }
  nav.rail a:nth-child(6):hover { color: #ff8f3c; text-shadow: 0 0 14px #ff8f3c; }
  nav.rail a:nth-child(7):hover { color: #7dff4d; text-shadow: 0 0 14px #7dff4d; }
  nav.rail a:focus-visible { color: var(--ink); outline: none; }
  nav.rail a.port { font-size: 19px; font-weight: 600; }
  nav.rail a { position: relative; }
  nav.rail a::after {
    content: attr(data-label);
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%);
    background: rgba(10,0,20,.35); border: 1px solid rgba(242,244,232,.10);
    padding: 3px 8px; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; letter-spacing: .02em; text-transform: none;
    color: rgba(242,244,232,.55); white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  nav.rail a:hover::after, nav.rail a:focus-visible::after { opacity: .9; }
  nav.rail a svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.rail a svg .fill { fill: currentColor; stroke: none; }

  @keyframes riseC { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .controls {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    display: flex; gap: 8px;
    opacity: .15; transition: opacity .6s ease;
  }
  .controls.on, .controls:hover { opacity: 1; }
  .controls button {
    font-family: system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1;
    color: rgba(242,244,232,.55); background: none; border: none;
    padding: 6px 8px; cursor: pointer;
    transition: color .3s, text-shadow .3s;
  }
  .controls button:hover { color: #fff; text-shadow: 0 0 12px rgba(242,244,232,.6); }
  #skipBtn { font-size: 17px; }

  @media (max-width: 620px) {
    nav.rail { gap: 2px 18px; bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    nav.rail { animation: none; opacity: 1; }
    #forest canvas { animation: none; }
  }
</style>
</head>
<body>

<h1 class="sr-only">Rimer London</h1>
<div id="forest" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<canvas id="grain" aria-hidden="true"></canvas>

<!-- Navigation (keyboard, touch, no-WebGL fallback). -->
<nav class="rail" aria-label="Links">
  <a href="https://soundcloud.com/rimer" target="_blank" rel="noopener" aria-label="SoundCloud" data-label="SoundCloud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A5.5 5.5 0 0 1 18.5 10 3.5 3.5 0 0 1 17.5 18H7z"/></svg>
  </a>
  <a href="https://www.mixcloud.com/rimer-london/" target="_blank" rel="noopener" aria-label="Mixcloud" data-label="Mixcloud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A5.5 5.5 0 0 1 18.5 10 3.5 3.5 0 0 1 17.5 18H7z"/><path class="fill" d="M10.5 12.5v4l3.5-2z"/></svg>
  </a>
  <a href="https://music.apple.com/nl/artist/rimer-london/351480381" target="_blank" rel="noopener" aria-label="Apple Music" data-label="Apple Music">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5V7l10-2v11.5"/><circle cx="6.8" cy="18.5" r="2.2"/><circle cx="16.8" cy="16.5" r="2.2"/></svg>
  </a>
  <a href="https://open.spotify.com/artist/4Kdb6rwgdSPx0P2AUhvdee" target="_blank" rel="noopener" aria-label="Spotify" data-label="Spotify">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 10.2c2.8-1 6-1 8.5.2M8.3 13c2.3-.7 4.8-.6 7 .3M8.8 15.7c1.9-.5 3.8-.4 5.7.3"/></svg>
  </a>
  <a href="https://instagram.com/rimerlondon" target="_blank" rel="noopener" aria-label="Instagram" data-label="Instagram">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle class="fill" cx="17.2" cy="6.8" r="1" stroke="none"/></svg>
  </a>
  <a href="/portfolio" class="port">Portfolio</a>
</nav>

<div class="controls">
  <button id="playBtn" type="button" aria-label="Play or pause music">&#9654;</button>
  <button id="skipBtn" type="button" aria-label="Skip to next track">&#9197;</button>
</div>
<audio id="au" preload="auto"></audio>

<noscript>
  <p style="position:fixed;inset:auto 0 120px;text-align:center;z-index:11">Rimer London — use the links below.</p>
</noscript>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduced ? 0 : 0.8;        // tunnel travel (slow)
const SPIN = reduced ? 0 : 0.035;       // spiral rotation (rad/s)
const SPAN = 270;

const container = document.getElementById('forest');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) { throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 0);

const tunnel = new THREE.Group();
scene.add(tunnel);

/* ---------- neon rings spiralling into the distance ---------- */
const RINGS = 90;
const rings = [];
const ringGeo = new THREE.TorusGeometry(7.5, 0.07, 8, 72);
const col = new THREE.Color();
for (let i = 0; i < RINGS; i++) {
  col.setHSL((i * 0.045) % 1, 1, 0.62);
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: col.clone(), transparent: true, opacity: 0.85 }));
  m.position.z = 4 - (i / RINGS) * SPAN;
  m.rotation.z = i * 0.42;
  m.userData.spin = 0.1 + (i % 5) * 0.03;
  tunnel.add(m);
  rings.push(m);
}

/* ---------- helix tubes (3 intertwined spirals) ---------- */
function helixTube(phase, color) {
  const pts = [];
  for (let z = 0; z >= -SPAN; z -= 6) {
    const a = phase + z * 0.055;
    pts.push(new THREE.Vector3(Math.cos(a) * 7.5, Math.sin(a) * 7.5, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 220, 0.09, 6, false);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
}
tunnel.add(helixTube(0, 0xff4ecd), helixTube(2.1, 0x4dffd2), helixTube(4.2, 0xffe14d));

/* ---------- spiral starfield ---------- */
const N = 7000;
const pos = new Float32Array(N * 3), clr = new Float32Array(N * 3), zz = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const z = 4 - Math.random() * SPAN;
  const a = i * 0.11 + z * 0.06;
  const r = 1.2 + (i % 90) * 0.085;
  zz[i] = z;
  pos[i * 3] = Math.cos(a) * r;
  pos[i * 3 + 1] = Math.sin(a) * r;
  pos[i * 3 + 2] = z;
  // stars: white / blue-white / warm, low saturation
  const warm = Math.random() < 0.25;
  col.setHSL(warm ? 0.11 : 0.58 + Math.random() * 0.08, Math.random() * 0.35, 0.72 + Math.random() * 0.26);
  clr[i * 3] = col.r; clr[i * 3 + 1] = col.g; clr[i * 3 + 2] = col.b;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(clr, 3));
const dotCanvas = document.createElement('canvas'); dotCanvas.width = dotCanvas.height = 32;
{
  const dg = dotCanvas.getContext('2d');
  const dgrad = dg.createRadialGradient(16, 16, 0, 16, 16, 16);
  dgrad.addColorStop(0, 'rgba(255,255,255,1)');
  dgrad.addColorStop(0.55, 'rgba(255,255,255,.85)');
  dgrad.addColorStop(0.8, 'rgba(255,255,255,.3)');
  dgrad.addColorStop(1, 'rgba(255,255,255,0)');
  dg.fillStyle = dgrad; dg.fillRect(0, 0, 32, 32);
}
const vortex = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.10, map: new THREE.CanvasTexture(dotCanvas), vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false }));
tunnel.add(vortex);

/* ---------- centre glow ---------- */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,.95)');
  grad.addColorStop(0.25, 'rgba(255,78,205,.35)');
  grad.addColorStop(1, 'rgba(255,78,205,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), transparent: true, opacity: 0.8, depthWrite: false }));
glow.scale.setScalar(9);
glow.position.z = -30;
scene.add(glow);

/* ---------- film grain ---------- */
const grain = document.getElementById('grain');
const gg = grain.getContext('2d');
grain.width = 256; grain.height = 256;
const grainImg = gg.createImageData(256, 256);
let lastGrain = 0;
function drawGrain(now) {
  if (reduced || now - lastGrain < 90) return;
  lastGrain = now;
  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gg.putImageData(grainImg, 0, 0);
}

/* ---------- background music + audio reactivity ---------- */
const TRACKS = ['au/1.m4a', 'au/2.m4a', 'au/3.m4a'];
const playBtn = document.getElementById('playBtn');
const skipBtn = document.getElementById('skipBtn');
let cur = document.getElementById('au');
let spare = new Audio();
spare.preload = 'auto';
let trackIdx = 0;
try {
  trackIdx = parseInt(localStorage.getItem('rl-au-index') || '0', 10) % TRACKS.length;
  localStorage.setItem('rl-au-index', String((trackIdx + 1) % TRACKS.length)); // reload = next track
} catch (e) {}
cur.src = TRACKS[trackIdx];

// Skip crossfade: new track in (~3s), previous out over ~40s.
const fadingOut = new Set();
const fadeTimers = new Map();
function fadeTo(el, target, ms, done) {
  if (fadeTimers.has(el)) clearInterval(fadeTimers.get(el));
  const from = el.volume, steps = Math.max(1, Math.round(ms / 100)), delta = (target - from) / steps;
  let n = 0;
  const iv = setInterval(() => {
    n++;
    el.volume = Math.min(1, Math.max(0, from + delta * n));
    if (n >= steps) { clearInterval(iv); fadeTimers.delete(el); if (done) done(); }
  }, 100);
  fadeTimers.set(el, iv);
}
function nextTrack(manual) {
  trackIdx = (trackIdx + 1) % TRACKS.length;
  try { localStorage.setItem('rl-au-index', String((trackIdx + 1) % TRACKS.length)); } catch (e) {}
  if (manual && audioOn && !cur.paused) {
    const old = cur, incoming = spare;
    fadingOut.add(old); fadingOut.delete(incoming);
    incoming.src = TRACKS[trackIdx];
    incoming.volume = 0;
    incoming.play().catch(() => {});
    fadeTo(incoming, 1, 3000);
    fadeTo(old, 0, 40000, () => { old.pause(); old.removeAttribute('src'); old.load(); fadingOut.delete(old); });
    cur = incoming; spare = old;
  } else {
    cur.src = TRACKS[trackIdx];
    cur.play().catch(() => {});
  }
}
for (const el of [cur, spare]) {
  el.addEventListener('play', () => { playBtn.innerHTML = '&#10074;&#10074;'; });
  el.addEventListener('pause', () => {
    if (cur.paused && spare.paused) playBtn.innerHTML = '&#9654;';
  });
  el.addEventListener('ended', () => {
    if (el === cur && !fadingOut.has(el)) nextTrack(false);
  });
}

let actx = null, analyser = null, freq = null, audioOn = false;
let bass = 0, mid = 0, treb = 0;
function startAudio() {
  if (audioOn) { if (actx) actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    for (const el of [cur, spare]) {
      const src = actx.createMediaElementSource(el);
      src.connect(analyser);
    }
    analyser.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    audioOn = true;
  } catch (e) {}
  cur.play().catch(() => {});
}
playBtn.addEventListener('click', () => {
  if (cur.paused) { startAudio(); cur.play().catch(() => {}); }
  else { cur.pause(); spare.pause(); }
});
skipBtn.addEventListener('click', () => { startAudio(); nextTrack(true); });

// controls barely visible until the mouse moves
const controls = document.querySelector('.controls');
let idleTimer = null;
function wakeControls() {
  controls.classList.add('on');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => controls.classList.remove('on'), 2500);
}
addEventListener('mousemove', wakeControls);
addEventListener('pointerdown', startAudio, { once: true });
startAudio(); // autoplay attempt; falls back to the sound button

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let t = 0;
let starVel = 0.15, starTarget = 0.15, starTimer = 4;
function tick(now) {
  requestAnimationFrame(tick);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  if (analyser && freq) {
    analyser.getByteFrequencyData(freq);
    const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += freq[i]; return s / ((b - a) * 255); };
    bass += (avg(1, 6) - bass) * 0.22;
    mid += (avg(6, 22) - mid) * 0.18;
    treb += (avg(22, 64) - treb) * 0.15;
  }

  tunnel.rotation.z += SPIN * dt;
  tunnel.scale.setScalar(1 + bass * 0.08);
  for (const r of rings) {
    r.position.z += SPEED * dt;
    if (r.position.z > 6) r.position.z -= SPAN;
    r.rotation.z += r.userData.spin * dt * 0.2;
  }
  starTimer -= dt;
  if (starTimer <= 0) {
    const r = Math.random();
    starTarget = r < 0.25 ? 0.002 + Math.random() * 0.01 : r < 0.5 ? 1.2 + Math.random() * 1.3 : 0.05 + Math.random() * 0.5;
    starTimer = 6 + Math.random() * 12;
  }
  starVel += (starTarget - starVel) * Math.min(1, dt * 0.3);
  const p = pGeo.attributes.position.array;
  for (let i = 0; i < N; i++) {
    zz[i] += SPEED * dt * starVel;
    if (zz[i] > 5) zz[i] -= SPAN;
    p[i * 3 + 2] = zz[i];
  }
  pGeo.attributes.position.needsUpdate = true;

  camera.position.x = Math.sin(t * 0.1) * 0.35 * (1 + mid * 0.5);
  camera.position.y = Math.cos(t * 0.08) * 0.35 * (1 + mid * 0.5);
  camera.lookAt(0, 0, -20);
  glow.material.opacity = 0.65 + Math.sin(t * 0.45) * 0.15 + treb * 0.3;

  drawGrain(now);
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
